services:
  db:
    image: postgres:16-alpine
    container_name: eventos-db
    environment:
      POSTGRES_USER: eventos
      POSTGRES_PASSWORD: eventos
      POSTGRES_DB: eventos
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/empresas.sql:/docker-entrypoint-initdb.d/01-empresas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventos -d eventos"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eventos_net
    restart: unless-stopped

  back:
    build: .
    container_name: eventos-back
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: eventos
      DB_PASSWORD: eventos
      DB_NAME: eventos
      DB_SSL: "false"
      FRONTEND_URL: http://localhost:8081
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eventos_net
    restart: unless-stopped

  front:
    build: ./front
    container_name: eventos-front
    ports:
      - "8081:80"
    depends_on:
      - back
    networks:
      - eventos_net
    restart: unless-stopped

networks:
  eventos_net:
    driver: bridge

volumes:
  db_data:
