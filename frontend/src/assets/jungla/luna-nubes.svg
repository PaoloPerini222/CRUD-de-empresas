<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <defs>
    <radialGradient id="halo1"><stop offset="0" stop-color="#dfeadb" stop-opacity=".50"/><stop offset=".35" stop-color="#b6d2c4" stop-opacity=".20"/><stop offset="1" stop-color="#b6d2c4" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo2"><stop offset="0" stop-color="#fffbe8" stop-opacity=".75"/><stop offset=".5" stop-color="#f1ecd0" stop-opacity=".22"/><stop offset="1" stop-color="#f1ecd0" stop-opacity="0"/></radialGradient>
    <radialGradient id="disco" cx=".40" cy=".36" r=".78"><stop offset="0" stop-color="#fffef4"/><stop offset=".5" stop-color="#f0ebd2"/><stop offset=".88" stop-color="#d6d0b2"/><stop offset="1" stop-color="#bdb897"/></radialGradient>
    <radialGradient id="limbo" cx=".5" cy=".5" r=".5"><stop offset=".62" stop-color="#1c1a10" stop-opacity="0"/><stop offset="1" stop-color="#1c1a10" stop-opacity=".42"/></radialGradient>
    <clipPath id="recorte"><circle cx="470" cy="250" r="118"/></clipPath>
    <filter id="maria" filterUnits="userSpaceOnUse" x="352" y="132" width="236" height="236">
      <feTurbulence type="fractalNoise" baseFrequency=".013 .016" numOctaves="5" seed="8"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .52  0 0 0 0 .50  0 0 0 0 .42  4 0 0 0 -1.85"/>
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <!-- nubes: ruido fractal convertido en transparencia; cada capa con su color y escala -->
    <filter id="nubeFondo" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="560">
      <feTurbulence type="fractalNoise" baseFrequency=".0045 .010" numOctaves="6" seed="3"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .40  0 0 0 0 .52  0 0 0 0 .56  3.6 0 0 0 -1.35"/>
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="nubeMedia" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="560">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .013" numOctaves="6" seed="12"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .66  0 0 0 0 .76  0 0 0 0 .78  3.8 0 0 0 -1.5"/>
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="nubeLuz" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="560">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .02" numOctaves="6" seed="21"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .90  0 0 0 0 .94  0 0 0 0 .90  4.2 0 0 0 -1.75"/>
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="hebras" filterUnits="userSpaceOnUse" x="0" y="0" width="900" height="560">
      <feTurbulence type="fractalNoise" baseFrequency=".0025 .045" numOctaves="4" seed="30"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .86  0 0 0 0 .92  0 0 0 0 .90  3.2 0 0 0 -1.4"/>
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <radialGradient id="velo"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="mFondo" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="560"><ellipse cx="450" cy="395" rx="400" ry="150" fill="url(#velo)"/></mask>
    <mask id="mMedia" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="560"><ellipse cx="450" cy="360" rx="360" ry="105" fill="url(#velo)"/></mask>
    <mask id="mLuz" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="560"><ellipse cx="490" cy="328" rx="250" ry="62" fill="url(#velo)"/></mask>
    <mask id="mHebras" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="560"><ellipse cx="470" cy="242" rx="300" ry="58" fill="url(#velo)"/></mask>
  </defs>
  <circle cx="470" cy="250" r="245" fill="url(#halo1)"/>
  <g mask="url(#mFondo)"><rect width="900" height="560" filter="url(#nubeFondo)" opacity=".85"/></g>
  <circle cx="470" cy="250" r="190" fill="url(#halo2)"/>
  <circle cx="470" cy="250" r="118" fill="url(#disco)"/>
  <g clip-path="url(#recorte)">
    <rect x="352" y="132" width="236" height="236" filter="url(#maria)" opacity=".9"/>
    
    <circle cx="433.6" cy="258.6" r="4.2" fill="#7f7a5e" fill-opacity=".20"/><circle cx="432.8" cy="257.9" r="3.5" fill="none" stroke="#fffbe8" stroke-opacity=".28" stroke-width="1"/><circle cx="470.4" cy="249.5" r="7.5" fill="#7f7a5e" fill-opacity=".20"/><circle cx="469.1" cy="248.2" r="6.2" fill="none" stroke="#fffbe8" stroke-opacity=".28" stroke-width="1"/><circle cx="476.5" cy="245.2" r="8.0" fill="#7f7a5e" fill-opacity=".20"/><circle cx="475.1" cy="243.7" r="6.6" fill="none" stroke="#fffbe8" stroke-opacity=".28" stroke-width="1"/><circle cx="467.0" cy="247.3" r="6.4" fill="#7f7a5e" fill-opacity=".20"/><circle cx="465.8" cy="246.1" r="5.3" fill="none" stroke="#fffbe8" stroke-opacity=".28" stroke-width="1"/><circle cx="456.9" cy="206.6" r="9.5" fill="#7f7a5e" fill-opacity=".20"/><circle cx="455.2" cy="204.9" r="7.8" fill="none" stroke="#fffbe8" stroke-opacity=".28" stroke-width="1"/><circle cx="483.1" cy="269.9" r="4.0" fill="#7f7a5e" fill-opacity=".20"/><circle cx="482.4" cy="269.2" r="3.3" fill="none" stroke="#fffbe8" stroke-opacity=".28" stroke-width="1"/><circle cx="377.4" cy="246.4" r="8.3" fill="#7f7a5e" fill-opacity=".20"/><circle cx="375.9" cy="244.9" r="6.8" fill="none" stroke="#fffbe8" stroke-opacity=".28" stroke-width="1"/><circle cx="475.8" cy="212.0" r="9.7" fill="#7f7a5e" fill-opacity=".20"/><circle cx="474.1" cy="210.2" r="8.0" fill="none" stroke="#fffbe8" stroke-opacity=".28" stroke-width="1"/><circle cx="493.4" cy="267.4" r="9.1" fill="#7f7a5e" fill-opacity=".20"/><circle cx="491.8" cy="265.8" r="7.4" fill="none" stroke="#fffbe8" stroke-opacity=".28" stroke-width="1"/><circle cx="463.6" cy="208.2" r="3.8" fill="#7f7a5e" fill-opacity=".20"/><circle cx="462.9" cy="207.5" r="3.1" fill="none" stroke="#fffbe8" stroke-opacity=".28" stroke-width="1"/><circle cx="467.8" cy="270.9" r="5.5" fill="#7f7a5e" fill-opacity=".20"/><circle cx="466.8" cy="269.9" r="4.5" fill="none" stroke="#fffbe8" stroke-opacity=".28" stroke-width="1"/><circle cx="477.3" cy="231.4" r="11.0" fill="#7f7a5e" fill-opacity=".20"/><circle cx="475.3" cy="229.4" r="9.0" fill="none" stroke="#fffbe8" stroke-opacity=".28" stroke-width="1"/><circle cx="474.0" cy="246.2" r="6.4" fill="#7f7a5e" fill-opacity=".20"/><circle cx="472.8" cy="245.1" r="5.3" fill="none" stroke="#fffbe8" stroke-opacity=".28" stroke-width="1"/><circle cx="467.6" cy="250.1" r="6.8" fill="#7f7a5e" fill-opacity=".20"/><circle cx="466.4" cy="248.9" r="5.6" fill="none" stroke="#fffbe8" stroke-opacity=".28" stroke-width="1"/><circle cx="479.4" cy="243.8" r="8.4" fill="#7f7a5e" fill-opacity=".20"/><circle cx="477.8" cy="242.3" r="6.9" fill="none" stroke="#fffbe8" stroke-opacity=".28" stroke-width="1"/><circle cx="512.0" cy="290.1" r="11.1" fill="#7f7a5e" fill-opacity=".20"/><circle cx="510.0" cy="288.1" r="9.1" fill="none" stroke="#fffbe8" stroke-opacity=".28" stroke-width="1"/>
    <circle cx="470" cy="250" r="118" fill="url(#limbo)"/>
  </g>
  <g mask="url(#mHebras)"><rect width="900" height="560" filter="url(#hebras)" opacity=".55"/></g>
  <g mask="url(#mMedia)"><rect width="900" height="560" filter="url(#nubeMedia)" opacity=".9"/></g>
  <g mask="url(#mLuz)"><rect width="900" height="560" filter="url(#nubeLuz)" opacity=".85"/></g>
</svg>